name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again — no point
# burning minutes on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Lint only, deliberately not `ruff format`. The formatter de-indents the
      # command samples inside module docstrings, which removes the visual cue
      # that they are code. Readability wins in a repo whose point is being read.
      - name: Lint
        run: ruff check .

      # Gate at 90, currently sitting at 99. The headroom is deliberate: a gate
      # pinned to the exact current number turns every later commit into a
      # coverage-chasing exercise and invites tests written to move the number
      # rather than to catch anything.
      #
      # This run is fully offline — a conftest fixture fails any unmarked test
      # that opens an HTTP connection.
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Types
        run: pyright

  integration:
    name: real archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Stamp the week
        id: stamp
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Keyed on the week, not on the source.
      #
      # This used to hash src/scorebook/data/loaders.py, which is a category error: what
      # is cached is the downloaded zip, and the zip does not change when the code that
      # reads it does. Every PR touching the loader evicted a perfectly good archive and
      # forced a fresh 6.8 MB fetch — and because this job and `smoke` share the key and
      # run in parallel, both missed at once and hit Cricsheet within seconds of each
      # other. Cricsheet throttles that, and the build went red. Twice in one afternoon.
      #
      # A weekly key still picks up a new season within a week, and restore-keys means a
      # stale archive is preferred to no archive.
      - name: Cache the archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/scorebook
          key: cricsheet-ipl-${{ steps.stamp.outputs.week }}
          restore-keys: cricsheet-ipl-

      # Parses all 295,732 real rows and asserts the measured counts. No
      # credentials: Cricsheet is a public download, so there is nothing to
      # expire or rotate.
      - name: Parse the real archive
        run: pytest -m integration -q

  smoke:
    name: end-to-end run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # The committed sample must work with no network at all — this is the
      # first thing a fresh clone does, and the thing most likely to rot.
      #
      # Proves the CLI works with no network. Asserts the match count, not the row
      # count: regenerating the sample after a new season changes rows legitimately,
      # and a build that goes red every May trains people to ignore it.
      #
      # The sample's real invariants — that it carries both `season` formats and a
      # pre-rename team name, which is the whole reason it is stratified rather than
      # random — are asserted in tests/test_sample.py, so they hold for every
      # `pytest` run and not only here.
      - name: Describe the committed sample offline
        run: |
          python -m scorebook describe --sample data/sample_deliveries.csv --clean | tee out.txt
          grep -qE "matches   2$" out.txt
          grep -q "season_year" out.txt
          echo "offline path works"

      - name: Stamp the week
        id: stamp
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Same key as the `real archive` job, on purpose: whichever job downloads first
      # populates the cache for the other. See that job for why it is dated rather than
      # hashed.
      - name: Cache the archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/scorebook
          key: cricsheet-ipl-${{ steps.stamp.outputs.week }}
          restore-keys: cricsheet-ipl-

      # Lower bounds, not equality. Cricsheet adds a season every May, so the row
      # and match counts only ever grow — asserting the exact 2026-08-11 figures
      # would turn a normal upstream update into a broken build.
      - name: Fetch and describe the full archive
        run: |
          scorebook fetch
          scorebook describe --clean | tee full.txt
          python - <<'EOF'
          import re, sys
          text = open("full.txt", encoding="utf-8").read()
          floors = {"rows": 295_732, "matches": 1_243, "seasons": 19}
          for label, floor in floors.items():
              found = re.search(rf"^{label}\s+([\d,]+)$", text, re.MULTILINE)
              if not found:
                  sys.exit(f"'{label}' missing from `scorebook describe` output")
              value = int(found.group(1).replace(",", ""))
              if value < floor:
                  sys.exit(f"{label}={value:,} is below the measured floor of {floor:,}")
              print(f"{label}={value:,} (>= {floor:,})")
          EOF
          echo "full archive meets the floors measured on 2026-08-11"

      # Regenerate the sample and report whether it drifted, without failing.
      # A new IPL season legitimately changes the "most recent match" the sample
      # is built from, so drift here means "regenerate the sample", not "the code
      # is broken" — and a red build every May would train people to ignore it.
      - name: Check the sample is still current
        run: |
          python scripts/make_sample.py
          if git diff --quiet data/sample_deliveries.csv; then
            echo "sample is current"
          else
            echo "::warning::data/sample_deliveries.csv is stale — run scripts/make_sample.py and commit"
            git diff --stat data/sample_deliveries.csv
          fi
